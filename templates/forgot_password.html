<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var s=localStorage.getItem("amarkrishi-theme");if(s==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
<title>{{ t('forgot_password') }} - Amar Krishi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <button type="button" class="theme-toggle" id="themeToggle" style="position:absolute;top:18px;right:18px;" aria-label="dark mode">
    <i class="fa-solid fa-moon"></i>
  </button>
  <div class="auth-card">
    <div class="brand"><i class="fa-solid fa-key"></i><h2>{{ t('forgot_password') }}</h2></div>
    <p class="sub">Enter your email and we'll send you a 6-digit reset code.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ t(message) }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label>{{ t('email') }}</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-block">Send Reset Code</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('auth.login') }}"><i class="fa-solid fa-arrow-left"></i> {{ t('login') }}</a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
