<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('login') }} - Amar Krishi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand"><span>🌱</span><h2>Amar Krishi</h2></div>
    <p class="sub">{{ t('welcome_back') }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label>{{ t('email') }}</label>
        <input type="text" name="email" class="form-control" placeholder="you@example.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>{{ t('password') }}</label>
        <div class="password-wrap">
          <input type="password" name="password" id="passwordField" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-eye" onclick="togglePasswordVisibility()" aria-label="Show password" tabindex="-1">
            <svg id="eyeIconOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeIconClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.62 21.62 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" name="remember_me"> {{ t('remember_me') }}
        </label>
        <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">{{ t('forgot_password') }}</a>
      </div>
      <button id="loginBtn" type="submit">{{ t('login') }}</button>
    </form>

    <div class="auth-footer">
      {{ t('create_account') }}? <a href="{{ url_for('auth.register') }}">{{ t('register') }}</a>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(){
  const field = document.getElementById('passwordField');
  const open = document.getElementById('eyeIconOpen');
  const closed = document.getElementById('eyeIconClosed');
  const showing = field.type === 'password';
  field.type = showing ? 'text' : 'password';
  open.style.display = showing ? 'none' : 'block';
  closed.style.display = showing ? 'block' : 'none';
}
</script>
</body>
</html>
