{% extends "layouts/base.html" %}
{% block content %}

<div class="card" style="text-align:center;padding:60px 30px;max-width:560px;margin:0 auto;">
  <i class="fa-solid {{ icon }}" style="font-size:46px;color:var(--color-primary);background:var(--color-primary-light);width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;"></i>
  <h2>{{ t(page_key) }}</h2>
  <p style="color:var(--color-text-muted);margin:14px 0 20px;">
    This module is part of the Amar Krishi platform demo. Connect a data source or AI model here to enable full functionality.
  </p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> {{ t('nav_dashboard') }}</a>
</div>

{% endblock %}
